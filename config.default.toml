# Trickpad
# ⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘⌘
# Every setting is in this file. Save it, then choose Reload Settings in the
# menu bar. Prefer not to edit it yourself? Choose Manage with Agent and
# describe what you want.
#
# Anything after a # is a note, and a line that starts with one is switched
# off. Notes you write beside a binding appear in the menu under Current
# Gestures.
#
# Every gesture, key, and action: https://thirdwind.fyi/trickpad/docs/

[GENERAL]

config-version = 3
dominant-hand = "right"
haptic-feedback = true
menu-bar-icon = "trickpad"   # Or name an SF Symbol: "sf:hand.tap.fill"
experimental-mouse-click-gestures = false

# ----------------------------------------

[MOUSE]

hold-left-tap-right = "return"
hold-right-tap-left = "escape"
two-finger-tap = { action = "middle-click", defer = true }

# three-finger-tap = "ctrl+cmd+a"   # A chord you already use. Delete the # to try it.
# front-right-tap = "url:shortcuts://run-shortcut?name=My%20Shortcut"

# ----------------------------------------

[TRACKPAD]

hold-left-tap-right = "return"
hold-right-tap-left = "escape"

# four-finger-tap = "url:things:///add?title={{clipboard|urlencode}}"   # New to-do from whatever you copied
# three-finger-tap = "script:~/bin/my-script"   # Any executable file, run directly

# ----------------------------------------

# A binding can apply in one app only. Name the app in the heading:

# [TRACKPAD."Finder"]
# top-right-corner-click = "cmd+i"   # Show info for the selected file
